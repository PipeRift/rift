name: build


on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'
  pull_request:
  workflow_call:

jobs:
  Build:
    name: ${{ matrix.os-name }} (${{ matrix.compiler }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Release]
        name: [windows-msvc, windows-clang, linux-clang, linux-gcc, macos-clang]
        include:
          - name: windows-msvc
            os: windows-2025
            os-name: windows
            compiler: msvc
            cxx: cl
            cc: cl
          - name: windows-clang
            os: windows-2025
            os-name: windows
            compiler: clang-21
            cxx: clang-cl
            cc: clang-cl
          - name: linux-clang
            os: ubuntu-24.04
            os-name: linux
            compiler: clang-21
            cxx: clang++
            cc: clang
          - name: linux-gcc
            os: ubuntu-24.04
            os-name: linux
            compiler: gcc-15
            cxx: g++
            cc: gcc
          - name: macos-clang
            os: macos-15
            os-name: macos
            compiler: clang-21
            cxx: clang++
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install dependencies
        if: ${{ matrix.os-name == 'linux'}}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xz-utils curl libx11-dev xorg-dev libglu1-mesa-dev libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ matrix.os-name == 'windows' }}
          cmake: true
          ninja: true

      - name: Cache Build
        uses: actions/cache@v6
        with:
          path: Build
          key: ${{ matrix.os-name }}-${{ matrix.compiler }}-${{ matrix.config }}-build-${{ secrets.VCACHE}}

      - name: Configure
        run: cmake -GNinja -S . -B Build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DRIFT_LLVM_PATH='${{ runner.temp }}/rift/llvm'

      - name: Build
        run: cmake --build Build --config ${{ matrix.config }}

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7
        if: ${{ matrix.config == 'Release' && contains(matrix.compiler, 'clang') }} # Only clang artifacts are stored
        with:
          name: rift-${{ matrix.os-name }}
          path: Build/Bin

      - name: Diagnose RiftTests crash (Windows)
        if: ${{ matrix.os-name == 'windows' }}
        working-directory: ./Build
        continue-on-error: true
        shell: cmd
        run: |
          set "CDB=C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if not exist "%CDB%" set "CDB=C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe"
          "%CDB%" -g -G -c "g; kb; q" Bin\RiftTests.exe

      - name: Diagnose RiftTests crash (macOS)
        if: ${{ matrix.os-name == 'macos' }}
        working-directory: ./Build
        continue-on-error: true
        run: |
          lldb -b -o run -k "thread backtrace all" -k "quit" ./Bin/RiftTests 2>&1 | tail -200

      - name: Run Tests
        working-directory: ./Build
        run: ctest --output-on-failure -j2 -C ${{ matrix.config }}
